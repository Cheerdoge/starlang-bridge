services:
  mysql:
    image: mysql:8.4
    container_name: starlang-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-starlang_bridge}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  app:
    build:
      context: .
    image: starlang-bridge:latest
    container_name: starlang-app
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # 覆盖 .env.prod 中的连接地址，指向 compose 内部服务名
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-starlang_bridge}
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - backend
      - web

  caddy:
    image: caddy:2
    container_name: starlang-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 有域名时填域名（自动 HTTPS）；留空则退化为 HTTP :80
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - web

volumes:
  mysql-data:
  caddy-data:
  caddy-config:

networks:
  backend:
  web:
